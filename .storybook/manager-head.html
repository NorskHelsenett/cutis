<!-- Default meta title -->
<title>Storybook - Cutis</title>
<meta name="title" content="Storybook - Cutis" />

<style>
  /* Tilpasser høyden på Storybook til å gi plass til header*/
  #root > * {
    height: calc(100dvh - 60px) !important;
  }

  #header {
    height: 60px;
    width: 100%;
    background-color: #015945; /* NHN Dark Green Primary */
  }

  .navbar {
    display: flex;
    flex-flow: row nowrap;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 100%;
    padding-right: 16px;
  }

  .logo-wrapper {
    display: flex;
    padding: 0px 28px;
  }

  ul {
    display: flex;
    flex-flow: row nowrap;
    justify-content: end;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  a {
    display: inline;
    box-decoration-break: clone;
    overflow-wrap: break-word;
    word-break: break-word;
    text-align: left;
    color: white;
    border: 2px solid transparent;
    text-decoration: underline;
    text-underline-offset: 0.16rem;
    text-decoration-color: white; 
    text-decoration-thickness: 1px;
    padding: 0.1rem;
  }

  a:hover {
    cursor: pointer;
  }

  [data-nodetype="document"] svg {
    color: #247360 !important; /* NHN Green 2_1 */
  }

  /* Story icon (currently light blue) */
  [data-nodetype="story"] svg {
    color: #247360 !important; /* NHN Green 2_1 */
  }

  /* Sidebar row states */
  [data-nodetype]:hover:not([data-selected='true']) {
    background-color: #41BC9F; /* green3_2 — hover */
  }

  [data-nodetype][data-selected='true'] {
    background-color: #02A67F; /* green3_1 — pressed/selected, belt-and-suspenders with colorSecondary */
  }

  [data-nodetype][aria-disabled='true'] {
    background-color: #DCDDDE; /* gray3 — disabled */
    cursor: not-allowed;
  }

  /* Icons turn white on hover or when selected */
  [data-nodetype]:hover svg,
  [data-nodetype][data-selected='true'] svg {
    color: #FFFFFF !important;
  }
  /* Row hovered, but three-dot button not itself hovered */
  [data-nodetype]:hover button:not(:hover) {
    background-color: transparent !important;
  }

  [data-nodetype] button,
  [data-nodetype] button:hover,
  [data-nodetype] button:focus,
  [data-nodetype] button:focus-visible {
    box-shadow: none !important;
    filter: none !important;
  }

</style>
