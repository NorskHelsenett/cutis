<title>Storybook - Cutis</title>
<meta name="title" content="Storybook - Cutis" />

<style>
  /* Tilpasser høyden på Storybook til å gi plass til header*/
  #root > * {
    height: calc(100dvh - 60px) !important;
  }

  #header {
    height: 60px;
    width: 100%;
    background-color: #FFE3E7; /* Cutis Light */
  }

  .navbar {
    display: flex;
    flex-flow: row nowrap;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 100%;
    padding-right: 16px;
  }

  .logo-wrapper {
    display: flex;
    padding: 0px 28px;
  }

  ul {
    display: flex;
    flex-flow: row nowrap;
    justify-content: end;
    align-items: center;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  a {
    display: inline;
    box-decoration-break: clone;
    overflow-wrap: break-word;
    word-break: break-word;
    text-align: left;
    color: #723E33;
    border: 2px solid transparent;
    text-decoration: underline;
    text-underline-offset: 0.16rem;
    text-decoration-color: #723E33;
    text-decoration-thickness: 1px;
    padding: 0.1rem;
  }

  a:hover {
    cursor: pointer;
  }

  img { /* MIDLERTIDIG: Logoen skal erstattes med SVG */
    width: 300px;
  }

  [data-nodetype="document"] svg {
    color: #7BEFB2 !important;
  }

  /* Story icon (currently light blue) */
  [data-nodetype="story"] svg {
    color: #7BEFB2 !important;
  }

</style>
